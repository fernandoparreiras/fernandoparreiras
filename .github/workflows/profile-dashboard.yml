name: Generate profile dashboard

on:
  schedule:
    # Mondays at 07:17 America/Sao_Paulo (10:17 UTC).
    - cron: "17 10 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-dashboard
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate dashboard SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_STATS_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
          PROFILE_USERNAME: fernandoparreiras
          PROFILE_DASHBOARD_OUT: assets/profile-dashboard.svg
          PROFILE_METRICS_OUT: assets/profile-metrics.json
          PROFILE_DASHBOARD_CACHE_KEY: ${{ github.run_id }}
          PROFILE_README_PATH: README.md
          PROFILE_UPDATE_README: "1"
        run: node scripts/generate-profile-dashboard.mjs

      - name: Commit updated dashboard
        uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
        with:
          commit_message: "Update generated profile dashboard"
          file_pattern: "README.md assets/profile-dashboard.svg assets/profile-metrics.json"
